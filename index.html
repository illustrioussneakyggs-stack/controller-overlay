<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<style>
body { margin:0; background:transparent; overflow:hidden; }

.wrap {
display:flex;
justify-content:space-around;
align-items:center;
height:100%;
}

/* shell */
.shell {
position:relative;
width:180px;
height:140px;
background:#e5e5e5;
border-radius:50px;
display:flex;
align-items:center;
justify-content:center;
box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
}

/* purple glow arc */
.shell::before {
content:"";
position:absolute;
width:100%;
height:100%;
border-radius:50px;
background:linear-gradient(120deg, transparent 60%, #a020f0);
opacity:0.8;
}

/* stick area */
canvas {
position:absolute;
} </style>

</head>

<body>

<div class="wrap">
  <div class="shell"><canvas id="l" width="120" height="120"></canvas></div>
  <div class="shell"><canvas id="r" width="120" height="120"></canvas></div>
</div>

<script>
const deadzone = 0.12;
let smooth = {lx:0, ly:0, rx:0, ry:0};

function draw(cvs, x, y) {
  const ctx = cvs.getContext("2d");
  const c = 60, r = 50;

  ctx.clearRect(0,0,120,120);

  // black circle
  ctx.beginPath();
  ctx.arc(c,c,r,0,Math.PI*2);
  ctx.fillStyle="black";
  ctx.fill();

  // deadzone
  ctx.beginPath();
  ctx.arc(c,c,r*deadzone,0,Math.PI*2);
  ctx.strokeStyle="#333";
  ctx.stroke();

  let mag = Math.sqrt(x*x+y*y);
  if (mag < deadzone) { x=0; y=0; }

  let dx = c + x*r;
  let dy = c + y*r;

  // line
  ctx.beginPath();
  ctx.moveTo(c,c);
  ctx.lineTo(dx,dy);
  ctx.strokeStyle="#a020f0";
  ctx.lineWidth=3;
  ctx.shadowColor="#a020f0";
  ctx.shadowBlur=15;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(dx,dy,4,0,Math.PI*2);
  ctx.fillStyle="#a020f0";
  ctx.fill();
}

function loop() {
  let gp = navigator.getGamepads()[0];

  if (gp) {
    // smoothing (important for video look)
    smooth.lx += (gp.axes[0]-smooth.lx)*0.2;
    smooth.ly += (gp.axes[1]-smooth.ly)*0.2;
    smooth.rx += (gp.axes[2]-smooth.rx)*0.2;
    smooth.ry += (gp.axes[3]-smooth.ry)*0.2;
  }

  draw(l, smooth.lx, smooth.ly);
  draw(r, smooth.rx, smooth.ry);

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
