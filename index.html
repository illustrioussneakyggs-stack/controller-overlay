<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// DPI fix
const scale = window.devicePixelRatio || 1;
canvas.width *= scale;
canvas.height *= scale;
ctx.scale(scale, scale);

const sticks = [
  { x: 110, y: 110 },
  { x: 310, y: 110 }
];

// Deadzone
function dz(v, d = 0.15) {
  if (Math.abs(v) < d) return 0;
  return (v - Math.sign(v) * d) / (1 - d);
}

// === FORCE GAMEPAD POLLING ===
let gamepadIndex = null;

function findGamepad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let i = 0; i < gps.length; i++) {
    if (gps[i]) return i;
  }
  return null;
}

// aggressively try to bind
function ensureGamepad() {
  if (gamepadIndex === null) {
    gamepadIndex = findGamepad();
  }
}

// reconnect support
window.addEventListener("gamepadconnected", (e) => {
  gamepadIndex = e.gamepad.index;
});

window.addEventListener("gamepaddisconnected", () => {
  gamepadIndex = null;
});

// === SHAPES ===
const shellPath = new Path2D(`
M -58 2
C -62 -30, -20 -52, 30 -48
C 55 -45, 70 -20, 60 10
C 52 35, 25 50, -10 48
C -40 45, -65 25, -58 2
Z
`);

function drawShell(cx, cy, flip = false, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.scale(flip ? -1 : 1, 1);

  ctx.fillStyle = "#f3f3f3";
  ctx.fill(shellPath);

  ctx.lineWidth = 4.5;
  ctx.strokeStyle = "#111";
  ctx.stroke(shellPath);

  let top = ctx.createLinearGradient(0, -60, 0, 0);
  top.addColorStop(0, "rgba(255,255,255,0.85)");
  top.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = top;
  ctx.fill(shellPath);

  let bottom = ctx.createLinearGradient(0, 10, 0, 60);
  bottom.addColorStop(0, "rgba(0,0,0,0)");
  bottom.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = bottom;
  ctx.fill(shellPath);

  const led = new Path2D(`M -35 -18 C -10 -45, 35 -42, 52 -8`);
  ctx.strokeStyle = "#a020ff";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.shadowColor = "#a020ff";
  ctx.shadowBlur = 16;
  ctx.stroke(led);

  ctx.strokeStyle = "#d080ff";
  ctx.lineWidth = 2;
  ctx.shadowBlur = 0;
  ctx.stroke(led);

  ctx.restore();
}

function drawStick(cx, cy, x, y, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;

  const r = 27;

  let ring = ctx.createRadialGradient(cx, cy, r - 12, cx, cy, r);
  ring.addColorStop(0, "#cfcfcf");
  ring.addColorStop(1, "#1a1a1a");

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = ring;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, r - 6, 0, Math.PI * 2);
  ctx.fillStyle = "#050505";
  ctx.fill();

  const dx = cx + x * r;
  const dy = cy + y * r;

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(dx, dy);
  ctx.strokeStyle = "#b040ff";
  ctx.lineWidth = 4;
  ctx.shadowColor = "#b040ff";
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(dx, dy, 9.5, 0, Math.PI * 2);
  let cap = ctx.createRadialGradient(dx-2, dy-2, 1, dx, dy, 9.5);
  cap.addColorStop(0, "#666");
  cap.addColorStop(1, "#111");
  ctx.fillStyle = cap;
  ctx.fill();

  ctx.restore();
}

// === ACTIVITY FADE ===
let activity = 0;

function loop() {
  ensureGamepad();

  const gp = gamepadIndex !== null
    ? navigator.getGamepads()[gamepadIndex]
    : null;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let alpha = 0.3;

  if (gp) {
    const axes = [
      dz(gp.axes[0] || 0),
      dz(gp.axes[1] || 0),
      dz(gp.axes[2] || 0),
      dz(gp.axes[3] || 0)
    ];

    const moving =
      axes.some(a => Math.abs(a) > 0.01) ||
      gp.buttons.some(b => b.value > 0.05);

    if (moving) activity = 1;
    else activity *= 0.92;

    alpha = 0.2 + activity * 0.8;

    drawShell(sticks[0].x, sticks[0].y, false, alpha);
    drawStick(sticks[0].x, sticks[0].y, axes[0], axes[1], alpha);

    drawShell(sticks[1].x, sticks[1].y, true, alpha);
    drawStick(sticks[1].x, sticks[1].y, axes[2], axes[3], alpha);
  } else {
    // idle render (never blank)
    drawShell(sticks[0].x, sticks[0].y, false, alpha);
    drawStick(sticks[0].x, sticks[0].y, 0, 0, alpha);

    drawShell(sticks[1].x, sticks[1].y, true, alpha);
    drawStick(sticks[1].x, sticks[1].y, 0, 0, alpha);
  }

  requestAnimationFrame(loop);
}

loop();
</script>
